<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ポケモンスリープ 食材管理シミュレータ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>ポケモンスリープ 食材管理</h1>
    <div class="controls">
      <div class="category-box">
        <label>料理カテゴリ</label>
        <select id="categorySelect">
          <option value="">-- 選択してください --</option>
          <option value="curry">カレー・シチュー</option>
          <option value="salad">サラダ</option>
          <option value="dessert">デザート・ドリンク</option>
        </select>
        <div class="recipes">
          <label>料理1</label>
          <select id="recipe1"></select>
          <label>料理2</label>
          <select id="recipe2"></select>
          <label>料理3</label>
          <select id="recipe3"></select>
        </div>
      </div>

      <div class="helpers-box">
        <h3>お手伝いチーム（最大5）</h3>
        <div class="helper-form">
          <input id="helperSpecies" placeholder="種族 (例: カメックス)" />
          <input id="helperLevel" type="number" placeholder="レベル" min="1" />
          <input id="helperComposition" placeholder="食材構成 (例: きのこ系/ねぎ系)" />
          <input id="helperSubskill" placeholder="サブスキル" />
          <input id="helperBaseSupply" type="number" placeholder="baseSupply (数値)" />
          <input id="helperNickname" placeholder="ニックネーム (任意)" />
          <button id="addHelperBtn">追加</button>
        </div>
        <ul id="helpersList"></ul>
      </div>

      <div class="changes-box">
        <h3>変更（入れ替え）</h3>
        <div class="change-form">
          <label>タイムスロット</label>
          <select id="changeSlot"></select>
          <label>入れ替え 元</label>
          <select id="changeFrom"></select>
          <label>入れ替え 先</label>
          <select id="changeTo"></select>
          <button id="addChangeBtn">入れ替え登録</button>
        </div>
        <ul id="changesList"></ul>
      </div>

      <div class="recipes-source">
        <h3>レシピ読み込み（任意）</h3>
        <input id="recipesUrl" placeholder="GitHub raw JSON の URL（任意）" />
        <button id="loadRecipesBtn">読み込み</button>
        <div id="warnings"></div>
      </div>
    </div>
  </header>

  <main>
    <section class="ingredients">
      <h2>初期所持食材（赤）</h2>
      <div class="ingredient-controls">
        <select id="ingredientPicker"></select>
        <button id="addIngredientBtn">＋ 追加</button>
      </div>
      <table id="mainTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>

    <aside class="side">
      <h3>変更入力（紫）</h3>
      <div id="changeEntries"></div>
      <h3>警告</h3>
      <div id="alerts"></div>
    </aside>
  </main>

  <footer>
    <p>※料理の食材消費はレシピに依存します。レシピは右上から読み込むかローカル定義を編集してください。</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
